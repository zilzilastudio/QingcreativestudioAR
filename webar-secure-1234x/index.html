<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bioluminescent Meadow AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d1117; 
      user-select: none;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #cameraVideo {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 1 !important; 
      transition: opacity 0.4s ease;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2 !important; 
      background: transparent !important; 
    }

    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      z-index: 9999 !important; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .login-box h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #95e1d3;
    }

    .input-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }

    .login-box input {
      width: 100%;
      padding: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      text-align: center;
    }

    .login-box input[type="password"] {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      user-select: none;
    }
    
    .toggle-password:hover {
      color: #95e1d3;
    }

    .login-box button.submit-btn {
      width: 100%;
      padding: 12px;
      background: #95e1d3;
      color: #121212;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .login-box button.submit-btn:hover {
      background: #fce38a;
    }

    .login-box button.submit-btn:disabled {
      opacity: 0.5;
      background: #95e1d3;
      cursor: not-allowed;
    }

    #startAudioOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9998 !important;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      cursor: pointer;
    }

    #startAudioOverlay h1 {
      font-size: 24px;
      color: #fce38a;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    #startAudioOverlay p {
      font-size: 14px;
      color: #95e1d3;
      opacity: 0.8;
    }

    #productPage {
      display: none; 
    }

    .copyright {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none; 
      z-index: 10;
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2cm;
      height: 2cm;
      opacity: 0.15; 
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Live Camera AR Video Feed -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <div id="loginScreen">
    <div class="login-box">
      <h2>Meadow Authorization</h2>
      
      <div class="input-container">
        <input type="text" id="serialInput" placeholder="Enter Product Serial Code" autocomplete="off">
      </div>

      <div class="input-container">
        <input type="password" id="passwordInput" placeholder="Enter Product Passkey" autocomplete="off">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Toggle Password Visibility">👁️</button>
      </div>
      
      <button onclick="checkPassword()" class="submit-btn" id="submitBtn">Unlock Experience</button>
    </div>
  </div>

  <!-- Tap to Start Audio Transition -->
  <div id="startAudioOverlay" onclick="enableAudioAndStart()">
    <h1>Tap to Start Experience</h1>
    <p>Tap anywhere on the screen to enable sound</p>
  </div>

  <div id="productPage">
    <div class="copyright">© 2026 Qingcreativestudio. All rights reserved</div>
    <img src="watermark.png" alt="Watermark" class="watermark">
  </div>

<script>
// ==========================================
// 1. NATIVE BROWSER AUDIO SETUP
// ==========================================
const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
const musicUrl = window.location.origin + basePath + 'Music.mp3';
const kalimbaUrl = window.location.origin + basePath + 'Kalimba.mp3';

const bgMusic = new Audio(musicUrl);
bgMusic.loop = true;
bgMusic.volume = 0.4;

const kalimbaAudio = new Audio(kalimbaUrl);
kalimbaAudio.volume = 0.8;

let isMuted = false;
let isExperienceUnlocked = false;
let isOriginalBg = false; // Toggle state for original vs camera background

// Auto-login on page load if saved in browser memory
document.addEventListener("DOMContentLoaded", () => {
  const savedAuth = localStorage.getItem("meadow_authenticated");
  if (savedAuth === "true") {
    unlockExperienceUILayout();
  }
});

function unlockExperienceUILayout() {
  localStorage.setItem("meadow_authenticated", "true");
  if (document.getElementById('loginScreen')) document.getElementById('loginScreen').style.display = 'none';
  if (document.getElementById('startAudioOverlay')) document.getElementById('startAudioOverlay').style.display = 'flex';
}

function enableAudioAndStart() {
  isExperienceUnlocked = true;

  if (document.getElementById('startAudioOverlay')) document.getElementById('startAudioOverlay').style.display = 'none';
  if (document.getElementById('productPage')) document.getElementById('productPage').style.display = 'block';

  if (!isMuted) {
    bgMusic.play().catch(err => console.error("Music playback prevented:", err));
  }

  kalimbaAudio.play().then(() => {
    kalimbaAudio.pause();
    kalimbaAudio.currentTime = 0;
  }).catch(() => {});
}

function playKalimbaSound() {
  if (isMuted) return;
  let soundClone = kalimbaAudio.cloneNode();
  soundClone.volume = 0.8;
  soundClone.playbackRate = 0.9 + Math.random() * 0.2;
  soundClone.play().catch(e => console.warn("Kalimba play error:", e));
}

function togglePasswordVisibility() {
  const passwordInput = document.getElementById('passwordInput');
  const toggleBtn = document.querySelector('.toggle-password');
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggleBtn.textContent = "🙈"; 
  } else {
    passwordInput.type = "password";
    toggleBtn.textContent = "👁️"; 
  }
}

async function generateDeviceFingerprint() {
  const traits = [
    navigator.userAgent,
    navigator.language,
    screen.colorDepth,
    `${screen.width}x${screen.height}`,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 'unknown'
  ];
  try {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (ctx) {
      ctx.textBaseline = "top";
      ctx.font = "14px 'Arial'";
      ctx.fillStyle = "#f60";
      ctx.fillRect(125,1,62,20);
      ctx.fillStyle = "#069";
      ctx.fillText("ZilzilaStudioGate", 2, 15);
      traits.push(canvas.toDataURL());
    }
  } catch (e) {}

  const traitString = traits.join('||');
  const encoder = new TextEncoder();
  const data = encoder.encode(traitString);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const serialNumber = document.getElementById('serialInput').value.trim();
  if (!serialNumber) return alert("Please input a valid product serial identification code.");

  const userPassword = document.getElementById('passwordInput').value.trim();
  if (!userPassword) return alert("Please input your package activation passkey.");

  const isMobileOrTabletUA = /Mobi|Android|iPhone|iPod|iPad/i.test(navigator.userAgent);
  const isModerniPadTouch = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  
  if (!isMobileOrTabletUA && !isModerniPadTouch) {
    return alert("Access Denied: This mobile AR experience is exclusive to smartphones and tablets. Laptops and Desktop PCs are not supported.");
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerText = "Verifying...";
  submitBtn.disabled = true;

  try {
    const currentFingerprint = await generateDeviceFingerprint();
    const workerUrl = "https://auth.zilzilastudio.com";
    
    const response = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        serial: serialNumber,
        password: userPassword,
        fingerprint: currentFingerprint,
        product: "box"
      })
    });

    const result = await response.json();

    if (response.ok && result.allowed) {
      unlockExperienceUILayout();
    } else {
      alert(result.error || "Authentication failed. Incorrect passkey assets.");
    }
  } catch (error) {
    alert("Authorization connection dropped or failed.\nReason: " + error.message);
  } finally {
    submitBtn.innerText = "Unlock Experience";
    submitBtn.disabled = false;
  }
}

// ==========================================
// 2. P5.JS VISUALIZER
// ==========================================
const PALETTES = [
  { flower: '#fce38a', stem: '#95e1d3', glow: 'rgba(252, 227, 138, 0.2)' },
  { flower: '#eaffd0', stem: '#a8df8e', glow: 'rgba(234, 255, 208, 0.2)' },
  { flower: '#fff4bd', stem: '#f3e99f', glow: 'rgba(255, 244, 189, 0.2)' }
];

const THIRD_PI = Math.PI / 3; 

let organisms = [];
let ambientOrbs = [];

let btnX, btnY;
let resetBtnX, resetBtnY;
let bgBtnX, bgBtnY;
let btnRadius = 22;

function setup() {
  let cnv = createCanvas(windowWidth, windowHeight);
  cnv.style('background', 'transparent');

  calculateButtonPositions();
  initCameraFeed();

  for (let i = 0; i < 3; i++) {
    ambientOrbs.push({
      xPct: random(0.2, 0.8),
      yPct: random(0.1, 0.4),
      sizeRatio: random(0.2, 0.4),
      phase: random(100)
    });
  }
}

function initCameraFeed() {
  const videoElement = document.getElementById('cameraVideo');
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    })
    .then((stream) => {
      videoElement.srcObject = stream;
    })
    .catch((err) => {
      console.warn("Environmental camera unavailable, falling back to front camera:", err);
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then((stream) => { videoElement.srcObject = stream; })
      .catch((e) => console.error("Camera access denied:", e));
    });
  }
}

function calculateButtonPositions() {
  btnX = width - 35;
  btnY = height - 35;
  resetBtnX = width - 90;
  resetBtnY = height - 35;
  bgBtnX = width - 145;
  bgBtnY = height - 35;
}

function draw() {
  if (isOriginalBg) {
    background(13, 17, 23); // Original dark background
  } else {
    clear(); // Transparent background overlaying live camera video
  }

  drawAmbientOverlays();

  for (let i = organisms.length - 1; i >= 0; i--) {
    let org = organisms[i];
    org.update();
    org.display();
    if (org.isDead) organisms.splice(i, 1);
  }

  if (isExperienceUnlocked && frameCount % 90 === 0 && organisms.length < 45) {
    let autoSeed = new Organism(random(width), -10);
    autoSeed.isAutoSpawned = true;
    organisms.push(autoSeed);
  }

  if (isExperienceUnlocked) {
    noStroke();
    fill(255, 255, 255, 140);
    textAlign(CENTER, CENTER);
    textSize(13);
    text("Tap screen to plant seeds onto your space", width / 2 - 40, height - 35);

    drawAudioButton();
    drawResetButton();
    drawBgToggleButton();
  }
}

function mousePressed() {
  if (isExperienceUnlocked) handleInteraction();
}

function touchStarted() {
  if (isExperienceUnlocked) {
    handleInteraction();
    return false; 
  }
}

function handleInteraction() {
  let dAudio = dist(mouseX, mouseY, btnX, btnY);
  if (dAudio < btnRadius) {
    toggleAudio();
    return; 
  }

  let dReset = dist(mouseX, mouseY, resetBtnX, resetBtnY);
  if (dReset < btnRadius) {
    clearMeadow();
    return; 
  }

  let dBg = dist(mouseX, mouseY, bgBtnX, bgBtnY);
  if (dBg < btnRadius) {
    toggleBackground();
    return;
  }

  if (!isMuted && bgMusic.paused) {
    bgMusic.play().catch(() => {});
  }

  if (mouseY < height - 60) {
    organisms.push(new Organism(mouseX, mouseY));
    playKalimbaSound();
  }
}

function toggleAudio() {
  isMuted = !isMuted;
  if (isMuted) {
    bgMusic.pause();
  } else {
    bgMusic.play().catch(e => console.warn("Toggle audio error:", e));
  }
}

function toggleBackground() {
  isOriginalBg = !isOriginalBg;
  const videoElement = document.getElementById('cameraVideo');
  if (videoElement) {
    videoElement.style.opacity = isOriginalBg ? "0" : "1";
  }
}

function clearMeadow() {
  organisms = [];
}

function drawAudioButton() {
  push();
  translate(btnX, btnY);
  noStroke();
  fill(149, 225, 211, isMuted ? 40 : 90);
  ellipse(0, 0, btnRadius * 2, btnRadius * 2);

  if (!isMuted) {
    fill('#fce38a');
    for (let a = 0; a < TWO_PI; a += HALF_PI) {
      push();
      rotate(a + QUARTER_PI);
      ellipse(7, 0, 14, 10);
      pop();
    }
    fill(255, 230);
    ellipse(0, 0, 5, 5);
  } else {
    fill('rgba(0,0,0,0.5)');
    stroke('#fce38a');
    strokeWeight(2);
    beginShape();
    vertex(0, -8);
    bezierVertex(6, -2, 5, 6, 0, 8);
    bezierVertex(-5, 6, -6, -2, 0, -8);
    endShape(CLOSE);

    stroke(255, 100, 100, 230);
    strokeWeight(2);
    line(-10, 10, 10, -10);
  }
  pop();
}

function drawResetButton() {
  push();
  translate(resetBtnX, resetBtnY);
  noStroke();
  fill(149, 225, 211, 80);
  ellipse(0, 0, btnRadius * 2, btnRadius * 2);

  fill('#95e1d3'); 
  for (let a = 0; a < TWO_PI; a += THIRD_PI) { 
    push();
    rotate(a);
    ellipse(5, 0, 10, 5); 
    pop();
  }
  fill('#fce38a'); 
  ellipse(0, 0, 4, 4);
  pop();
}

// Additional Flower Button for Background Toggle
function drawBgToggleButton() {
  push();
  translate(bgBtnX, bgBtnY);
  noStroke();
  fill(252, 227, 138, isOriginalBg ? 90 : 40);
  ellipse(0, 0, btnRadius * 2, btnRadius * 2);

  fill(isOriginalBg ? '#95e1d3' : '#fce38a'); 
  let petNum = 5;
  for (let i = 0; i < petNum; i++) { 
    push();
    rotate((TWO_PI / petNum) * i);
    ellipse(6, 0, 10, 6); 
    pop();
  }
  fill(255, 255, 255, 220); 
  ellipse(0, 0, 5, 5);
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  calculateButtonPositions();
}

function drawAmbientOverlays() {
  push();
  let refDim = max(width, height);
  for (let orb of ambientOrbs) {
    let pulse = map(sin(frameCount * 0.005 + orb.phase), -1, 1, 0.7, 1.2);
    let currentSize = (refDim * orb.sizeRatio) * pulse;
    let currentX = width * orb.xPct;
    let currentY = height * orb.yPct;
    noStroke();
    for (let r = currentSize; r > 0; r -= 20) {
      let alpha = map(r, 0, currentSize, isOriginalBg ? 12 : 8, 0); 
      fill(74, 144, 226, alpha);
      ellipse(currentX, currentY, r, r);
    }
  }
  pop();
}

class Organism {
  constructor(x, y) {
    this.xPct = x / width;
    this.yPct = y < 0 ? y : y / height;
    this.isAutoSpawned = false;

    this.state = "SEED"; 
    this.fallSpeedPct = random(0.003, 0.006); 
    this.growSpeed = random(1.5, 3.0);
    this.swayOffset = random(1000);
    this.stemHeight = 0;
    this.heightRatio = random(0.25, 0.60);

    this.flowerScale = 0;
    this.maxFlowerScale = random(14, 24);
    this.bloomSpeed = 0.03;
    this.pulsePhase = random(100);
    this.palette = random(PALETTES);
  }

  update() {
    let t = frameCount * 0.01;
    let wind = sin(t + this.swayOffset) * 0.0005;
    
    // Unified root baseline line across all screens (height - 40px)
    let targetAnchorY = height - 40;

    switch (this.state) {
      case "SEED":
        if (this.yPct < 0) {
          this.yPct = ((-10) + (frameCount % 100)) / height; 
        } else {
          this.yPct += this.fallSpeedPct;
        }
        this.xPct += wind;

        let currentSeedPixelY = this.yPct * height;
        if (currentSeedPixelY >= targetAnchorY) {
          this.state = "SPROUT";
        }
        break;

      case "SPROUT":
        this.stemHeight += this.growSpeed;
        let maxAllowedStemHeight = targetAnchorY * this.heightRatio;
        if (this.stemHeight >= maxAllowedStemHeight) {
          this.stemHeight = maxAllowedStemHeight;
          this.state = "BLOOM";
        }
        break;

      case "BLOOM":
        if (this.flowerScale < this.maxFlowerScale) {
          this.flowerScale += (this.maxFlowerScale - this.flowerScale) * this.bloomSpeed + 0.02;
        } else {
          this.flowerScale = this.maxFlowerScale;
        }
        break;
    }
  }

  display() {
    push();
    let currentAnchorX = this.xPct * width;
    // Unified root baseline line across all screens
    let currentAnchorY = height - 40;

    let maxAllowedStemHeight = currentAnchorY * this.heightRatio;
    let globalSway = sin(frameCount * 0.008 + this.swayOffset) * 12 * (this.stemHeight / maxAllowedStemHeight);

    if (this.state === "SEED") {
      let seedPixelY = this.yPct * height;
      if (seedPixelY < 0) seedPixelY = -10; 

      noStroke();
      fill(this.palette?.flower || '#fce38a');
      ellipse(currentAnchorX, seedPixelY, 6, 6);
      fill(this.palette?.glow || 'rgba(252, 227, 138, 0.2)');
      ellipse(currentAnchorX, seedPixelY, 16, 16);
    } 
    else {
      let currentPalette = this.palette || PALETTES[0];
      noFill();
      stroke(currentPalette.stem);
      strokeWeight(1.6); 

      beginShape();
      let segments = 20;
      let currentTopX = currentAnchorX;
      let currentTopY = currentAnchorY;

      for (let i = 0; i <= segments; i++) {
        let hRatio = i / segments;
        let currentY = currentAnchorY - (this.stemHeight * hRatio);
        let noiseFactor = noise(currentAnchorX * 0.01, currentY * 0.01 + frameCount * 0.002);
        let swayX = map(noiseFactor, 0, 1, -15, 15) * hRatio + (globalSway * hRatio);
        let currentX = currentAnchorX + swayX;

        vertex(currentX, currentY);
        if (i === segments) {
          currentTopX = currentX;
          currentTopY = currentY;
        }
      }
      endShape();

      if (this.state === "BLOOM" && this.flowerScale > 0) {
        let pulse = map(sin(frameCount * 0.02 + this.pulsePhase), -1, 1, 0.9, 1.1);
        let size = this.flowerScale * pulse;

        push();
        translate(currentTopX, currentTopY);
        noStroke();
        fill(currentPalette.glow);
        ellipse(0, 0, size * 3, size * 3);
        ellipse(0, 0, size * 1.8, size * 1.8);

        fill(currentPalette.flower);
        for (let a = 0; a < TWO_PI; a += HALF_PI) {
          push();
          rotate(a + QUARTER_PI); 
          ellipse(size * 0.35, 0, size * 0.7, size * 0.6);
          pop();
        }
        fill(255, 255, 255, 240);
        ellipse(0, 0, size * 0.25, size * 0.25);
        pop();
      }
    }
    pop();
  }
}
</script>
</body>
</html>
